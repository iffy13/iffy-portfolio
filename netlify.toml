# Netlify reads this file and overrides the dashboard build settings.
[build]
  publish = "site"
  command = ""

# The AI chat assistant (netlify/functions/chat.mjs) reads site/projects.js for its knowledge.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["site/projects.js", "netlify/functions/persona.md", "netlify/functions/examples.json"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
